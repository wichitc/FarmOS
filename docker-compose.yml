name: durianos

services:
  db:
    image: timescale/timescaledb-ha:pg16-all
    restart: unless-stopped
    environment:
      POSTGRES_USER: durianos
      POSTGRES_PASSWORD: durianos
      POSTGRES_DB: durianos
    ports:
      - "5544:5432"
    volumes:
      - db-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durianos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  # Declared per DEP-001 for later phases (IoT/Vision AI/Edge) - not yet
  # wired into application code in Phase 3, just available in the dev stack.
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: durianos
      MINIO_ROOT_PASSWORD: durianos123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  nats:
    image: nats:latest
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "4222:4222"

  # Embeddings provider for the Knowledge Base's real semantic search
  # (Phase 28, ADR-011's Ollama-local default applied to embeddings, not
  # just chat) - CPU-only, no GPU passthrough configured here since
  # nomic-embed-text is small enough to run acceptably without one for
  # dev/pilot scale. Pull the model once the container is up:
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://durianos:durianos@db:5432/durianos
      APP_DATABASE_URL: postgresql+psycopg://durianos_app:durianos_app@db:5432/durianos
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: dev-only-insecure-secret-change-me
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # IoT ingestion worker (Phase 7): MQTT -> validate -> store -> rules ->
  # alerts (SRS IOT-001). Same image as `backend`, different entrypoint -
  # no reason to duplicate the Dockerfile for one command difference.
  iot-ingestion:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://durianos:durianos@db:5432/durianos
      APP_DATABASE_URL: postgresql+psycopg://durianos_app:durianos_app@db:5432/durianos
      SECRET_KEY: dev-only-insecure-secret-change-me
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      backend:
        condition: service_started
    command: python -m app.scripts.mqtt_ingestion_worker

  # SLA breach watcher (master-prompt integration, Phase 33): same image
  # as `backend`/`iot-ingestion`, different entrypoint - the simple
  # polling loop `iot_models.Alert`'s own docstring flagged as missing
  # ("needs a scheduler this repo doesn't have").
  sla-watcher:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://durianos:durianos@db:5432/durianos
      APP_DATABASE_URL: postgresql+psycopg://durianos_app:durianos_app@db:5432/durianos
      SECRET_KEY: dev-only-insecure-secret-change-me
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.scripts.sla_watcher

  # Trial expiry watcher (master-prompt integration, Phase 34): same
  # shape as `sla-watcher`, one job per script.
  trial-watcher:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://durianos:durianos@db:5432/durianos
      APP_DATABASE_URL: postgresql+psycopg://durianos_app:durianos_app@db:5432/durianos
      SECRET_KEY: dev-only-insecure-secret-change-me
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.scripts.trial_watcher

volumes:
  db-data:
  minio-data:
  ollama-data:
